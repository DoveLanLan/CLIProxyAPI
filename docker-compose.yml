services:
  cli-proxy-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-}
        GOPROXY: ${GOPROXY:-https://goproxy.cn|direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.google.cn}
    container_name: cli-proxy-api
    # env_file:
    #   - .env
    environment:
      DEPLOY: ${DEPLOY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8317:8317"
      - "18085:8085"
      - "51455:1455"
      - "54545:54545"
      - "51121:51121"
      - "11451:11451"
    volumes:
      - ${CLI_PROXY_CONFIG_PATH:-./config.yaml}:/CLIProxyAPI/config.yaml
      - ${CLI_PROXY_AUTH_PATH:-./auths}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    restart: unless-stopped

  cpa-manager:
    image: seakee/cpa-manager:latest
    container_name: cpa-manager
    restart: unless-stopped
    depends_on:
      - cli-proxy-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CPA_UPSTREAM_URL: ${CPA_MANAGER_CPA_URL:-http://cli-proxy-api:8317}
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY:-}
    ports:
      - "${CPA_MANAGER_PORT:-18317}:18317"
    volumes:
      - cpa-manager-data:/data

volumes:
  cpa-manager-data:
