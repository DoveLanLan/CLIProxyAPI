allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: true
external-controller: "0.0.0.0:9090"
secret: "REPLACE_WITH_THE_SAME_VALUE_AS_controller-secret"

profile:
  store-selected: true

proxy-providers: {}

proxy-groups:
  - &lane
    name: xai-lane-1
    type: select
    proxies: [REJECT]
  - <<: *lane
    name: xai-lane-2
  - <<: *lane
    name: xai-lane-3
  - <<: *lane
    name: xai-lane-4
  - <<: *lane
    name: xai-lane-5
  - <<: *lane
    name: xai-lane-6
  - <<: *lane
    name: xai-probe

listeners:
  - {name: xai-lane-1-in, type: http, listen: "0.0.0.0", port: 17891, proxy: xai-lane-1, users: []}
  - {name: xai-lane-2-in, type: http, listen: "0.0.0.0", port: 17892, proxy: xai-lane-2, users: []}
  - {name: xai-lane-3-in, type: http, listen: "0.0.0.0", port: 17893, proxy: xai-lane-3, users: []}
  - {name: xai-lane-4-in, type: http, listen: "0.0.0.0", port: 17894, proxy: xai-lane-4, users: []}
  - {name: xai-lane-5-in, type: http, listen: "0.0.0.0", port: 17895, proxy: xai-lane-5, users: []}
  - {name: xai-lane-6-in, type: http, listen: "0.0.0.0", port: 17896, proxy: xai-lane-6, users: []}
  - {name: xai-probe-in, type: http, listen: "0.0.0.0", port: 17899, proxy: xai-probe, users: []}

rules:
  - MATCH,REJECT
