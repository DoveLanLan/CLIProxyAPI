services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:?set CLI_PROXY_IMAGE}
    container_name: cli-proxy-api
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${TAILSCALE_BIND_IP:?set TAILSCALE_BIND_IP}:${TAILSCALE_MANAGEMENT_PORT:-18317}:8317"
    expose:
      - "8317"
    volumes:
      - ./data/config.yaml:/CLIProxyAPI/config.yaml
      - ./data/auths:/root/.cli-proxy-api
      - ./data/logs:/CLIProxyAPI/logs
    networks:
      - proxy

  cpa-manager:
    image: seakee/cpa-manager:latest
    container_name: cpa-manager
    restart: unless-stopped
    depends_on:
      - cli-proxy-api
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CPA_UPSTREAM_URL: ${CPA_MANAGER_CPA_URL:-http://cli-proxy-api:8317}
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY:-}
      USAGE_QUERY_LIMIT: ${CPA_MANAGER_USAGE_QUERY_LIMIT:-1000}
    ports:
      - "${TAILSCALE_BIND_IP:?set TAILSCALE_BIND_IP}:${TAILSCALE_CPA_MANAGER_PORT:-18318}:18317"
    expose:
      - "18317"
    volumes:
      - ./data/cpa-manager:/data
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${GATEWAY_NETWORK:-vps-gateway}
