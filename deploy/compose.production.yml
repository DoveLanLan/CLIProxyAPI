services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:?set CLI_PROXY_IMAGE}
    container_name: cli-proxy-api
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${TAILSCALE_BIND_IP:?set TAILSCALE_BIND_IP}:${TAILSCALE_MANAGEMENT_PORT:-18317}:8317"
    expose:
      - "8317"
    volumes:
      - ./data/config.yaml:/CLIProxyAPI/config.yaml
      - ./data/auths:/root/.cli-proxy-api
      - ./data/logs:/CLIProxyAPI/logs
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${GATEWAY_NETWORK:-vps-gateway}
